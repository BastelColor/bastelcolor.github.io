# main に push すると、サイトをビルドして GitHub Pages（https://bastelcolor.github.io/）に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。途中の公開は止めずに最後まで終わらせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 機械の版は固定する（ubuntu-latest は予告どおりに新しい版へ切りかわり、Chrome の場所などが変わりうる）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 書き方と型のまちがいがあれば、ここで止める（公開しない）
      - run: npm run lint
      - run: npm run typecheck

      # next.config.ts の output: 'export' で、dist/client に静的なファイルを書き出す
      - run: npm run build

      # 公開する前に、おもな画面（トップ・各部屋・作品・アバター・記事・404）を
      # 本物のブラウザで開いて、エラーが出ないかを確かめる（scripts/smoke-test.mjs）
      - run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 表示の速さに関わる数（ページのずれ・読み込むファイルの大きさ）が、上限を超えていないかを確かめる
      # （scripts/perf-check.mjs。超えていたら公開しない）
      - run: npm run perf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 見えにくい人・キーボードの人にとって困るところ（ボタンの名前もれ・文字と背景のコントラストなど）が
      # 増えていないかを確かめる（scripts/a11y-check.mjs。スマホの大きさで、明るいテーマと暗いテーマ）
      - run: npm run a11y -- --ci
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 見た目が大きく崩れていないかを、前に公開したときに撮った画面とくらべる（scripts/visual-test.mjs の --ci）。
      # 前の画面は GitHub のキャッシュに取っておく。わざと見た目を大きく変えたときは、
      # コミットのメッセージに [visual-accept] と書くと止めない
      - uses: actions/cache/restore@v6
        with:
          path: .visual/baseline
          key: visual-baseline-${{ github.run_id }}
          restore-keys: visual-baseline-
      - run: npm run visual -- --ci ${{ contains(github.event.head_commit.message, '[visual-accept]') && '--accept-changes' || '' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # 止まったときは、くらべた一覧（report.html と画像）を、実行のページからダウンロードできるようにする
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: .visual/
          include-hidden-files: true
      - uses: actions/cache/save@v6
        with:
          path: .visual/baseline
          key: visual-baseline-${{ github.run_id }}

      - uses: actions/configure-pages@v6

      # dist/client の、名前が . で始まるファイル（.vite など）は入らない
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
