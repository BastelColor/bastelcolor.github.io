# main に push すると、サイトをビルドして GitHub Pages（https://bastelcolor.github.io/）に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。途中の公開は止めずに最後まで終わらせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 機械の版は固定する（ubuntu-latest は予告どおりに新しい版へ切りかわり、Chrome の場所などが変わりうる）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 書き方と型のまちがいがあれば、ここで止める（公開しない）
      - run: npm run lint
      - run: npm run typecheck

      # next.config.ts の output: 'export' で、dist/client に静的なファイルを書き出す
      - run: npm run build

      # 公開する前に、おもな画面（トップ・各部屋・作品・アバター・記事・404）を
      # 本物のブラウザで開いて、エラーが出ないかを確かめる（scripts/smoke-test.mjs）
      - run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/configure-pages@v6

      # dist/client の、名前が . で始まるファイル（.vite など）は入らない
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
